  review_notes: |
    Sonance is a chromatic instrument tuner. It requires microphone access to detect pitch from the device microphone. All audio processing happens on-device; nothing is recorded or uploaded.

    How to test: Use a physical iPhone or iPad (simulator mic is unreliable). Grant microphone permission on launch, tap Start, and play a note near the device — e.g. pluck a guitar string or use an online tone generator. The note name, cent offset, and needle should update in real time.

    No login or network connection is required.

