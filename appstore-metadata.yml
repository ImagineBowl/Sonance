  keywords: "tuner,pitch,guitar,chromatic,music,instrument,hz,cents,violin,ukulele,bass,tuning"

  description: |
    Sonance is a fast, accurate chromatic tuner for musicians. Point your iPhone or iPad at your instrument and get instant feedback — note name, octave, cent offset, and frequency — on a clear animated gauge.

    Features
    • Real-time chromatic tuning (A440 reference)
    • Note + octave display (e.g. A4)
    • Cent offset and Hz readout
    • Color-coded feedback: in tune, close, or out of tune
    • Adjustable input sensitivity for quiet or loud environments
    • On-device processing — your audio never leaves your device

    Works with guitar, bass, violin, ukulele, and other pitched instruments.

    Microphone access is required for pitch detection.

  whats_new: |
